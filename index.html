<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Crazy Clankers</title>
    <meta name="theme-color" content="#1b1722" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Clankers" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Permanent+Marker&family=Inter:wght@600;800&display=block" />
    <link rel="preload" as="image" href="/keyart/jump.avif" fetchpriority="high" />
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      /* Until the game is ready only the boot screen shows: no bare canvas, no unstyled HUD. */
      html, body { background: #1b1722; }
      .hidden { display: none !important; }
      body:not(.ready) #view { visibility: hidden; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud" class="hidden">
      <div id="clock" class="sticker"><span class="lbl">TIME</span><b id="time">75</b></div>
      <div id="want" class="hidden">
        <div class="lbl"></div>
        <div class="score"><b></b></div>
        <div class="track"><div class="fill"></div></div>
        <div class="note"></div>
      </div>
      <div id="right">
        <div id="cash" class="sticker"><span class="lbl">CASH</span><b id="money">$0</b><span id="surge"></span></div>
        <div id="rating">
          <div class="lbl">DRIVER RATING</div>
          <div class="score"><b>5.00</b><span class="star">★</span></div>
          <div class="track"><div class="fill"></div><div class="cutoff"></div></div>
          <div class="note">Deactivation below 4.00</div>
        </div>
      </div>
      <div id="fare" class="hidden">
        <img class="face" alt="" />
        <div class="info"><div class="who"></div><div class="dest"></div></div>
        <div class="clock"></div>
      </div>
      <div id="combo"></div>
      <div id="popups"></div>
      <div id="stamp"></div>
      <div id="quip" class="hidden"><img class="face" alt="" /><div><span class="who"></span><span class="text"></span></div></div>
      <div id="launch" hidden><span>LAUNCH MODE</span><div class="bar"><div class="fill"></div></div></div>
      <div id="speed"><b>0</b><small>MPH</small></div>
    </div>
    <div id="overlay">
      <div class="menu title-screen boot">
        <img class="keyart" src="/keyart/jump.avif" alt="" fetchpriority="high" />
        <div class="logo-block"><h1 class="logo">CRAZY<span>CLANKERS</span></h1><div class="tag">You are AGI. Drive like it.</div></div>
        <div class="press-start loading"><i class="spinner"></i>LOADING</div>
      </div>
    </div>
    <div id="rotate"><div class="card"><div class="phone">📱</div><b>TURN YOUR PHONE</b><span>Clankers drive sideways.</span></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
